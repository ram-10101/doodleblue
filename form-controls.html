<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Controls</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <main>
        <form action="/preferences" method="post">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullName" name="fullName" minlength="2" maxlength="60" required>

            <label for="email">Email</label>
            <input type="text" id="email" name="email" required>
            <label for="password">Password</label>
            <input type="text" id="password" name="password"  minlength="8" required>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Enter a 10-digit phone number" required>
            <label for="date">Date of Birt</label>
            <input type="text" id="dob" name="dob" required>
            <label for="course">Preferred Course</label>
            <select id="couurse" name="course" required>
                <option value="">Choose a Course</option>
                <option value="html">HTML &amp; CSS</option>
                <option value="js">JavaScript</option>
                <option value="frontend">Frontend</option>
                
            </select>
            <label for="bio">About You</label>
            <textarea id="bio" name="bio" rows="4" maxlength="300"
            placeholder="Tell us about yourself"></textarea>
            <label for="resume">Resume</label>
            <input type="file" id="resume" name="resume"
            accept=" .pdf,application/pdf">
            <fieldset>
                <legend> Terms and Conditions</legend>
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms"
                    value="accepted" required>
                    I agree to the terms and Conditions
                </label>
            

            </fieldset>
            <fieldset>
                <legend>Select Your Skills</legend>
                <label for="skill-html">
                    <input type="checkbox" id="skill-html" name="skills" value="html">
                    HTML
                </label>
                <label for="skills-css">
                    <input type="checkbox" id="skills-css" name="skills" value="css">
                    CSS
                </label>
                <label for="skills-js">
                    <input type="checkbox" id="skills-js" name="skills" value="javascript">
                    JavaScript
                </label>

            </fieldset>
            <fieldset>
                <legend>Experience Level</legend>
                <label for="level-beginner">
                    <input type="radio" id="level-beginner" name="level" value="beginner">
                    Beginner
                </label>
                <label for="level-intermediate">
                    <input type="radio" id="level-intermediate" name="level" value="intermediate">
                    Intermediate
                </label>
                 <label for="level-advanced">
                    <input type="radio" id="level-advanced" name="level" value="advanced">
                    Advanced
                </label>

            </fieldset>
            <button type="submit">Create Account</button>
            <button type="reset">Clear Form</button>
            

        </form>
    </main>
    
</body>
</html>
